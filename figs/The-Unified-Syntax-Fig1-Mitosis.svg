<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="Figure 1 — Mitosis: the one becomes two">
  <!-- Figure 1: MITOSIS — the one becomes two. Schematic, not to scale. -->
  <g stroke="#000" stroke-width="4" fill="none">
    <!-- I. Interphase -->
    <circle cx="115" cy="120" r="85"/>
    <path d="M60,105 q18,-16 36,0 t36,0 t36,0"/>
    <path d="M62,135 q18,-16 36,0 t36,0 t36,0"/>
    <!-- II. Metaphase -->
    <circle cx="345" cy="120" r="85"/>
    <line x1="345" y1="42" x2="345" y2="198" stroke-dasharray="8,6" stroke-width="2"/>
    <g stroke-width="5">
      <line x1="331" y1="71" x2="359" y2="99"/><line x1="359" y1="71" x2="331" y2="99"/>
      <line x1="331" y1="106" x2="359" y2="134"/><line x1="359" y1="106" x2="331" y2="134"/>
      <line x1="331" y1="141" x2="359" y2="169"/><line x1="359" y1="141" x2="331" y2="169"/>
    </g>
    <!-- III. Anaphase -->
    <circle cx="575" cy="120" r="85"/>
    <g stroke-width="7" stroke-linecap="round">
      <line x1="558" y1="58" x2="558" y2="82"/><line x1="575" y1="52" x2="575" y2="76"/><line x1="592" y1="58" x2="592" y2="82"/>
      <line x1="558" y1="158" x2="558" y2="182"/><line x1="575" y1="164" x2="575" y2="188"/><line x1="592" y1="158" x2="592" y2="182"/>
    </g>
    <!-- IV. Telophase -->
    <circle cx="758" cy="120" r="58"/><circle cx="832" cy="120" r="58"/>
    <circle cx="758" cy="120" r="20"/><circle cx="832" cy="120" r="20"/>
    <!-- arrows -->
    <g stroke-width="4">
      <line x1="212" y1="120" x2="248" y2="120"/><polygon points="248,112 262,120 248,128" fill="#000" stroke="none"/>
      <line x1="442" y1="120" x2="478" y2="120"/><polygon points="478,112 492,120 478,128" fill="#000" stroke="none"/>
      <line x1="672" y1="120" x2="688" y2="120"/><polygon points="688,112 702,120 688,128" fill="#000" stroke="none"/>
    </g>
  </g>
  <g font-family="Georgia, serif" font-size="19" text-anchor="middle" fill="#000">
    <text x="115" y="248">I. Interphase</text>
    <text x="345" y="248">II. Metaphase</text>
    <text x="575" y="248">III. Anaphase</text>
    <text x="795" y="248">IV. Telophase</text>
    <text x="115" y="272" font-size="14" font-style="italic">the formless deep</text>
    <text x="345" y="272" font-size="14" font-style="italic">the alignment</text>
    <text x="575" y="272" font-size="14" font-style="italic">the separation</text>
    <text x="795" y="272" font-size="14" font-style="italic">the two</text>
  </g>
</svg>
