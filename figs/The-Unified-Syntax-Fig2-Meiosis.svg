<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Figure 2 — Meiosis: the halving that assigns gender">
  <!-- Figure 2: MEIOSIS — the halving that assigns. X blue, Y red. Schematic. -->
  <g font-family="Georgia, serif" fill="#000">
    <text x="120" y="30" font-size="19" text-anchor="middle">diploid — XY</text>
    <text x="370" y="30" font-size="19" text-anchor="middle">gametes — halved</text>
    <text x="600" y="30" font-size="19" text-anchor="middle">ovum — X</text>
    <text x="790" y="30" font-size="19" text-anchor="middle">the assignment</text>
  </g>
  <g stroke="#000" stroke-width="4" fill="none">
    <!-- diploid cell -->
    <circle cx="120" cy="170" r="75"/>
    <line x1="80" y1="150" x2="160" y2="150"/>
    <line x1="80" y1="170" x2="160" y2="170"/>
    <line x1="85" y1="200" x2="145" y2="200" stroke="#1a3a8f" stroke-width="7" stroke-linecap="round"/>
    <line x1="95" y1="222" x2="130" y2="222" stroke="#8f1a1a" stroke-width="7" stroke-linecap="round"/>
    <!-- arrow to gametes -->
    <line x1="208" y1="170" x2="248" y2="170" stroke-width="4"/>
    <polygon points="248,162 262,170 248,178" fill="#000" stroke="none"/>
    <!-- four gametes -->
    <circle cx="320" cy="100" r="38"/><circle cx="420" cy="100" r="38"/>
    <circle cx="320" cy="240" r="38"/><circle cx="420" cy="240" r="38"/>
    <line x1="305" y1="100" x2="335" y2="100" stroke="#1a3a8f" stroke-width="7" stroke-linecap="round"/>
    <line x1="405" y1="100" x2="435" y2="100" stroke="#1a3a8f" stroke-width="7" stroke-linecap="round"/>
    <line x1="308" y1="240" x2="332" y2="240" stroke="#8f1a1a" stroke-width="7" stroke-linecap="round"/>
    <line x1="408" y1="240" x2="432" y2="240" stroke="#8f1a1a" stroke-width="7" stroke-linecap="round"/>
    <!-- arrow to ovum -->
    <line x1="472" y1="170" x2="512" y2="170" stroke-width="4"/>
    <polygon points="512,162 526,170 512,178" fill="#000" stroke="none"/>
    <!-- ovum -->
    <circle cx="600" cy="170" r="55"/>
    <line x1="578" y1="170" x2="622" y2="170" stroke="#1a3a8f" stroke-width="7" stroke-linecap="round"/>
    <!-- arrows to zygotes -->
    <line x1="655" y1="140" x2="705" y2="105" stroke-width="4"/>
    <polygon points="705,97 719,99 710,111" fill="#000" stroke="none"/>
    <line x1="655" y1="200" x2="705" y2="235" stroke-width="4"/>
    <polygon points="705,243 719,241 710,229" fill="#000" stroke="none"/>
    <!-- zygotes -->
    <circle cx="790" cy="105" r="45"/><circle cx="790" cy="235" r="45"/>
    <line x1="772" y1="98" x2="800" y2="98" stroke="#1a3a8f" stroke-width="7" stroke-linecap="round"/>
    <line x1="772" y1="114" x2="800" y2="114" stroke="#1a3a8f" stroke-width="7" stroke-linecap="round"/>
    <line x1="772" y1="228" x2="800" y2="228" stroke="#1a3a8f" stroke-width="7" stroke-linecap="round"/>
    <line x1="776" y1="244" x2="796" y2="244" stroke="#8f1a1a" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g font-family="Georgia, serif" font-size="22" text-anchor="middle" fill="#000">
    <text x="790" y="112" fill="#1a3a8f">XX</text>
    <text x="790" y="242" fill="#8f1a1a">XY</text>
  </g>
</svg>
